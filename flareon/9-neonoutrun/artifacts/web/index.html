<!DOCTYPE html> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <style> * { user-select: none; -webkit-user-select: none; touch-action: none; } html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; background: #111; color: #0f0; font-family: monospace; } #ui { width: 180px; height: 100%; background: #0d0d0d; padding: 15px; box-sizing: border-box; border-right: 2px solid #333; flex-shrink: 0; z-index: 10; } h1 { margin: 0 0 15px 0; font-size: 18px; color: #0f0; } p { font-size: 13px; line-height: 1.4; color: #aaa; margin: 6px 0; } .highlight { color: #0f0; font-weight: bold; } #canvas-container { flex-grow: 1; height: 100%; position: relative; background: #1b4d1b; } canvas { width: 100%; height: 100%; display: block; } .modal-screen { display: none; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-size: 20px; font-weight: bold; background: rgba(10, 10, 10, 0.94); padding: 25px 35px; border-radius: 10px; z-index: 20; max-width: 80%; } .red-modal { color: #ff3333; border: 3px solid #ff3333; box-shadow: 0 0 15px rgba(255, 0, 0, 0.5); } .yellow-modal { color: #f7e62e; border: 3px solid #f7e62e; box-shadow: 0 0 15px rgba(252, 223, 1, 0.5); } .green-modal { color: #00ff66; border: 3px solid #00ff66; box-shadow: 0 0 15px rgba(0, 255, 102, 0.5); } </style> <div id="ui"> <h1>Neon OutRun</h1> <p>Controls:</p> <p><span class="highlight">&uarr; / &darr;</span> Accelerate</p> <p><span class="highlight">&larr; / &rarr;</span> Steer</p> <p><span class="highlight">R</span> Restart</p> <br> <p>Lap: <span id="lap-num" class="highlight">1 / 28</span></p> <p>Cur. Lap: <span id="lap-timer" class="highlight">0.0s</span></p> <p>Prev. Lap: <span id="prev-lap" class="highlight">--</span></p> <p>Best Lap: <span id="best-lap" class="highlight">--</span></p> </div> <div id="canvas-container"> <div id="crash-screen" class="modal-screen red-modal"> CRASHED<br><br> <span style="color:#fff; font-size:16px;">Press 'R' to Restart</span> </div> <div id="message-screen" class="modal-screen yellow-modal"> <span id="message" style="color:red; font-size:18px; font-weight:bold; overflow-wrap:break-word;"></span><br><br> <span style="color:#fff; font-size:16px;">Press 'R' to Restart</span> </div> <div id="neon-screen" class="modal-screen green-modal"> <span id="neon" style="color:yellow; font-size:18px; font-weight:bold; overflow-wrap:break-word;"></span><br><br> <span style="color:#fff; font-size:16px;">Press 'R' to Restart</span> </div> <canvas id="neonCanvas"></canvas> </div> <img id="carImg" src="car.png" style="display:none;" /> <img id="obsImg" src="obstacle.png" style="display:none;" /> <img id="treeImg" src="tree.png" style="display:none;" /> <img id="lapImg" src="lap.png" style="display:none;" /> <script>const{invoke}=window.__TAURI__.core;const canvas=document.getElementById('neonCanvas');const ctx=canvas.getContext('2d');const carImg=document.getElementById('carImg');const obsImg=document.getElementById('obsImg');const treeImg=document.getElementById('treeImg');const lapImg=document.getElementById('lapImg');const crashScreen=document.getElementById('crash-screen');const messageScreen=document.getElementById('message-screen');const neonScreen=document.getElementById('neon-screen');let clientLaps=[];const trees=[];function generateTrees(){trees.length=0;for(let y=5000;y>=-105000;y-=20+Math.random()*15){const numLeft=1+Math.floor(Math.random()*2);for(let k=0;k<numLeft;k++){trees.push({side:'left',relX:Math.random(),worldY:y+(Math.random()*20-10),scale:0.75+Math.random()*0.5});}const numRight=1+Math.floor(Math.random()*2);for(let k=0;k<numRight;k++){trees.push({side:'right',relX:Math.random(),worldY:y+(Math.random()*20-10),scale:0.75+Math.random()*0.5});}}trees.sort((a,b)=>a.worldY-b.worldY);}generateTrees();function resizeCanvas(){canvas.width=canvas.clientWidth;canvas.height=canvas.clientHeight;}resizeCanvas();window.addEventListener('resize',resizeCanvas);const AudioContext=window.AudioContext||window.webkitAudioContext;const actx=new AudioContext();const osc=actx.createOscillator();const gain=actx.createGain();osc.type='sawtooth';osc.connect(gain);gain.connect(actx.destination);gain.gain.value=0;osc.start();const input={up:false,down:false,left:false,right:false,restart:false,bounds:null};let audioStarted=false;window.addEventListener('keydown',e=>{if(!audioStarted){actx.resume();audioStarted=true;}if(e.key==='ArrowUp')input.up=true;if(e.key==='ArrowDown')input.down=true;if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key==='r'||e.key==='R')input.restart=true;});window.addEventListener('keyup',e=>{if(e.key==='ArrowUp')input.up=false;if(e.key==='ArrowDown')input.down=false;if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false;if(e.key==='r'||e.key==='R')input.restart=false;});let isInit=false;async function initNeon(){if(isInit)return;isInit=true;loop();}let inFrame=false;async function loop(){if(inFrame){requestAnimationFrame(loop);return;}inFrame=true;try{const roadWidth=Math.min(320,canvas.width*0.7);const roadLeft=(canvas.width-roadWidth)/2;const roadRight=roadLeft+roadWidth;const roadCenter=canvas.width/2;input.bounds={left:roadLeft,right:roadRight};let resStr=await invoke('plugin:neon|e',{input:JSON.stringify(input)});let res=JSON.parse(resStr);let state=res.state;let obstacles=res.obstacles||[];if(res.laps)clientLaps=res.laps;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#1b4d1b';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#444';ctx.fillRect(roadLeft,0,roadWidth,canvas.height);ctx.setLineDash([]);ctx.strokeStyle='#e00';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(roadLeft,0);ctx.lineTo(roadLeft,canvas.height);ctx.moveTo(roadRight,0);ctx.lineTo(roadRight,canvas.height);ctx.stroke();const carScreenY=canvas.height*state.carRatio;ctx.strokeStyle='#fff';ctx.lineWidth=8;ctx.setLineDash([40,40]);ctx.lineDashOffset=state.y;ctx.beginPath();ctx.moveTo(roadCenter,0);ctx.lineTo(roadCenter,canvas.height);ctx.stroke();for(let i=0;i<clientLaps.length;i++){const lapY=clientLaps[i];const screenY=(lapY-state.y)+carScreenY;if(screenY>=-60&&screenY<=canvas.height+60){const w=48;const h=48;if(lapImg&&lapImg.complete&&lapImg.naturalWidth>0){ctx.drawImage(lapImg,roadCenter-w/2,screenY-h/2,w,h);}else{ctx.fillStyle='#ff0';ctx.beginPath();ctx.arc(roadCenter,screenY,20,0,Math.PI*2);ctx.fill();}}}for(let i=0;i<trees.length;i++){const t=trees[i];const screenY=(t.worldY-state.y)+carScreenY;if(screenY>=-100&&screenY<=canvas.height+100){let treeX=0;if(t.side==='left'){treeX=t.relX*Math.max(10,roadLeft-30);}else{treeX=roadRight+25+t.relX*Math.max(10,canvas.width-roadRight-35);}const w=50*t.scale;const h=60*t.scale;if(treeImg&&treeImg.complete&&treeImg.naturalWidth>0){ctx.drawImage(treeImg,treeX-w/2,screenY-h/2,w,h);}else{ctx.fillStyle='#0e4a0e';ctx.beginPath();ctx.arc(treeX,screenY,20*t.scale,0,Math.PI*2);ctx.fill();}}}for(let i=0;i<obstacles.length;i++){const obs=obstacles[i];const screenY=(obs.worldY-state.y)+carScreenY;if(screenY>=-50&&screenY<=canvas.height+50){const obsX=roadLeft+obs.relX*(roadRight-roadLeft);const w=42;const h=42;if(obsImg&&obsImg.complete&&obsImg.naturalWidth>0){ctx.drawImage(obsImg,obsX-w/2,screenY-h/2,w,h);}else{ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(obsX,screenY,18,0,Math.PI*2);ctx.fill();}}}ctx.save();ctx.translate(state.x,carScreenY);ctx.rotate(state.angle);if(carImg.complete&&carImg.naturalWidth>0){ctx.drawImage(carImg,-25,-25,50,50);}else{ctx.fillStyle='#00f';ctx.fillRect(-25,-25,50,50);}ctx.restore();document.getElementById('lap-num').innerText=`${state.currentLap} / ${res.totalLaps || 28}`;document.getElementById('lap-timer').innerText=state.currentLapTime||"0.0s";document.getElementById('prev-lap').innerText=state.previousLapTime||"--";document.getElementById('best-lap').innerText=state.bestLapTime||"--";if(state.crashed){crashScreen.style.display='block';messageScreen.style.display='none';neonScreen.style.display='none';}else if(state.blocked){crashScreen.style.display='none';messageScreen.style.display='block';neonScreen.style.display='none';document.getElementById('message').innerText=state.message;}else if(state.finished){crashScreen.style.display='none';messageScreen.style.display='none';neonScreen.style.display='block';document.getElementById('neon').innerText=state.neon;}else{crashScreen.style.display='none';messageScreen.style.display='none';neonScreen.style.display='none';}if(audioStarted&&!state.crashed&&!state.blocked&&!state.finished){if(Math.abs(state.speed)>0.05){gain.gain.value=0.05;osc.frequency.value=50+Math.abs(state.speed)*30;}else{gain.gain.value=0;}}else if(state.crashed){gain.gain.value=0.08;osc.frequency.value=35;}else{gain.gain.value=0;}}catch(e){console.error(e);}finally{inFrame=false;}requestAnimationFrame(loop);}setTimeout(()=>{if(!isInit)initNeon();},500);if(carImg.complete){initNeon();}else{carImg.onload=initNeon;}</script>
