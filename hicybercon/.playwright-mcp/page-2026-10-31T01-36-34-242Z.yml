    - heading "Answers to Questions (FAQ)" [level=2] [ref=f116e99]
    - generic [ref=f116e100]:
      - generic [ref=f116e101]:
        - heading "What is a (mono-)alphabetical substitution? (Definition)" [level=3] [ref=f116e102]
        - generic [ref=f116e104]:
          - paragraph [ref=f116e105]:
            - text: An
            - term [ref=f116e106]: alphabetic substitution
            - text: is a substitution cipher where the letters of the alphabet are replaced by others according to a 1-1 correspondence (a plain letter always corresponds to the same cipher letter).
          - paragraph [ref=f116e107]: The substitution is said to be monoalphabetic because it uses only one alphabet, this alphabet is said to be disordered.
      - generic [ref=f116e108]:
        - heading "How to encrypt using an alphabetical substitution?" [level=3] [ref=f116e109]
        - generic [ref=f116e111]:
          - paragraph [ref=f116e112]:
            - text: The
            - term [ref=f116e113]: monoalphabetical substitution
            - text: consists in using a
            - link "mixed alphabet" [ref=f116e114] [cursor=pointer]:
              - /url: https://www.dcode.fr/deranged-alphabet-generator
            - text: (with the letters in an unusual order) and
            - link "replacing the letters" [ref=f116e115] [cursor=pointer]:
              - /url: https://www.dcode.fr/word-letter-change
            - text: of the alphabet normal by it.
          - paragraph [ref=f116e117]:
            - text: "Example: BYKWASLFXOCZTDHJUMIGPVENQR is a totally"
            - link "random alphabet" [ref=f116e118] [cursor=pointer]:
              - /url: https://www.dcode.fr/deranged-alphabet-generator
            - text: with the 26 letters of the Latin alphabet.
          - paragraph [ref=f116e119]: "To understand, write the alphabet over the classic alphabet:"
          - table [ref=f116e120]:
            - rowgroup [ref=f116e121]:
              - row [ref=f116e122]:
                - rowheader "Plain alphabet" [ref=f116e123]
                - cell "ABCDEFGHIJKLMNOPQRSTUVWXYZ" [ref=f116e124]
              - row [ref=f116e125]:
                - rowheader "Substitution alphabet" [ref=f116e126]
                - cell "BYKWASLFXOCZTDHJUMIGPVENQR" [ref=f116e127]
          - paragraph
          - paragraph [ref=f116e128]: The substitution involves a replacement in the plaintext of all the letters of the first row with the letters associated with the second row.
          - paragraph [ref=f116e130]: "Example: All A become N, all the B remain B, all the C become A, etc."
          - paragraph [ref=f116e132]: "Example: With this substitution DCODE is encrypted as WKHWA."
          - paragraph [ref=f116e134]:
            - text: Any
            - link "deranged alphabet" [ref=f116e135] [cursor=pointer]:
              - /url: https://www.dcode.fr/deranged-alphabet-generator
            - text: can be used to create a
            - term [ref=f116e136]: mono alphabetic substitution
            - text: "provided it respects the criterion of an alphabet: not containing the same letter several times."
      - generic [ref=f116e137]:
        - heading "What do K1, K2, K3, K4 mean?" [level=3] [ref=f116e138]
        - generic [ref=f116e140]:
          - paragraph [ref=f116e141]: The K1, K2, K3, and K4 classifications are used by the ACA to describe the use of keywords in encryption alphabets.
          - paragraph [ref=f116e142]: "— K1: The key is inserted into the substitution alphabet, usually at the beginning and then the rest of the letters follow in alphabetical order."
          - paragraph [ref=f116e144]: "Example: Default CODEABFGHIJKLMNPQRSTUVWXYZ but an offset is possible XYZCODEABFGHIJKLMNPQRSTUVW"
          - paragraph [ref=f116e145]: "— K2: The key is inserted into the substitution (reciprocal) coded alphabet ⇅."
          - paragraph [ref=f116e146]: "— K3: The key is used in both plaintext and coded alphabets."
          - paragraph [ref=f116e147]: "— K4: Two different keys are used: one for the substitution alphabet and another for the coded alphabet."
      - generic [ref=f116e148]:
        - heading "How to decrypt using an alphabetical substitution?" [level=3] [ref=f116e149]
        - generic [ref=f116e151]:
          - paragraph [ref=f116e152]: Decryption requires knowing the alphabet mixed used and the inverse substitution encryption.
          - paragraph
          - table [ref=f116e153]:
            - rowgroup [ref=f116e154]:
              - row [ref=f116e155]:
                - rowheader "Substitution Alphabet" [ref=f116e156]
                - cell "NBAJYFOWLZMPXIKUVCDEGRQSTH" [ref=f116e157]
              - row [ref=f116e158]:
                - rowheader "Plain Alphabet" [ref=f116e159]
                - cell "ABCDEFGHIJKLMNOPQRSTUVWXYZ" [ref=f116e160]
          - paragraph
          - paragraph [ref=f116e161]: The substitution involves replacing in the ciphertext all the letters of the first row with the letters associated with the second row.
          - paragraph [ref=f116e163]: "Example: The encrypted message JAKJY has for plain message DCODE."
      - generic [ref=f116e164]:
        - heading "How to recognize a mono alphabetical substituted text?" [level=3] [ref=f116e165]
        - generic [ref=f116e167]:
          - paragraph [ref=f116e168]:
            - text: The ciphered message has an
            - link "index of coincidence" [ref=f116e169] [cursor=pointer]:
              - /url: https://www.dcode.fr/index-coincidence
            - text: identical to the language of the plain text.
          - paragraph [ref=f116e170]: English speakers call this encryption aristocrat (if there are spaces) or patristocrat (if there are no spaces between words).
      - generic [ref=f116e171]:
        - heading "How to decipher a substitution without the alphabet?" [level=3] [ref=f116e172]
        - generic [ref=f116e174]:
          - paragraph [ref=f116e175]: The MCMC technique (used by dCode) is one of the most effective for finding the most probable plain text and proposing a replacement alphabet.
          - paragraph [ref=f116e176]: dCode additionally adds an interactive tool to manually decrypt substitution-encrypted messages.
          - paragraph [ref=f116e177]: Another possibility, the known plaintext attack that makes possible to deduce some letters of the alphabet via the knowledge or the preliminary guess of certain portions of the plain text.
          - paragraph [ref=f116e179]: "Example: The most common alphabets used for substitutions are: QWERTYUIOPASDFGHJKLZXCVBNMMNBVCXZLKJHGFDSAPOIUYTREWQQAZWSXEDCRFVTGBYHNUJMIKOLPAZERTYUIOPQSDFGHJKLMWXCVBNNBVCXWMLKJHGFDSQPOIUYTREZAAQWZSXEDCRFVTGBYHNUJIKOLPMZYXWVUTSRQPONMLKJIHGFEDCBAAEIOUYBCDFGHJKLMNPQRSTVWXZ'Pangrams can also be used as an alphabet (by removing redundant letters)."
      - generic [ref=f116e185]:
        - heading "What is the MCMC technique?" [level=3] [ref=f116e186]
        - generic [ref=f116e188]:
          - paragraph [ref=f116e189]:
            - text: MCMC (
            - link "Markov Chain" [ref=f116e190] [cursor=pointer]:
              - /url: https://www.dcode.fr/markov-chain-text
            - text: Monte Carlo) is the name given to a statistical method that applies very well to mono-alphabetical substitutions.
          - paragraph [ref=f116e191]: "1 - Initialization: use a random substitution alphabet (but it is possible to carry out an analysis of letter frequencies to obtain a first plain alphabet - encrypted alphabet mapping table)."
          - paragraph [ref=f116e192]:
            - text: "2 - Evaluation: calculation of the probability that the current substitution alphabet produces plain text (score generally based on the frequencies of appearance of"
            - link "bigrams" [ref=f116e193] [cursor=pointer]:
              - /url: https://www.dcode.fr/bigrams
            - text: in the target language).
          - paragraph [ref=f116e194]: "3 - Modification of the alphabet: randomly exchange certain plain letter-cipher letter correspondences"
          - paragraph [ref=f116e195]: 4 - Repeat steps 2 and 3 as long as the plausibility score of the message obtained increases and the alphabet selected offers the most probable plain message.
          - paragraph [ref=f116e196]:
            - text: "Source:"
            - link "here" [ref=f116e197] [cursor=pointer]:
              - /url: https://www.ams.org/journals/bull/2009-46-02/S0273-0979-08-01238-X/S0273-0979-08-01238-X.pdf
            - text: Diaconis, Persi. (2009). The
            - link "Markov Chain" [ref=f116e200] [cursor=pointer]:
              - /url: https://www.dcode.fr/markov-chain-text
            - text: Monte Carlo Revolution. Bulletin of the American Mathematical Society. 46. 179-205. 10.1090/S0273-0979-08-01238-X.
      - generic [ref=f116e201]:
        - heading "What are the variants of the substitution cipher?" [level=3] [ref=f116e202]
        - generic [ref=f116e204]:
          - paragraph [ref=f116e205]:
            - text: First, some substitution use specific alphabets, such as
            - link "Atbash" [ref=f116e206] [cursor=pointer]:
              - /url: https://www.dcode.fr/atbash-cipher
            - text: that takes the alphabet backwards ZYXWVUTSRQPONMLKJIHGFEDCBA or the
            - link "Caesar cipher" [ref=f116e207] [cursor=pointer]:
              - /url: https://www.dcode.fr/caesar-cipher
            - text: which uses a shifted alphabet DEFGHIJKLMNOPQRSTUVWXYZABC that is shifted by 3.
          - paragraph [ref=f116e208]:
            - text: There are also substitutions that use several alphabets, alphabet that changes depending on an algorithm defined by encryption (e.g.
            - link "Vigenere" [ref=f116e209] [cursor=pointer]:
              - /url: https://www.dcode.fr/vigenere-cipher
            - text: uses 26 alphabets).
          - paragraph [ref=f116e210]: In game-play journals, substitution games / exercises are often called cryptograms.
      - button "❓ Ask a new question" [ref=f116e211] [cursor=pointer]
