    - heading "Answers to Questions (FAQ)" [level=2] [ref=f147e58]
    - generic [ref=f147e59]:
      - generic [ref=f147e60]:
        - heading "What is a cipher identifier? (Definition)" [level=3] [ref=f147e61]
        - paragraph [ref=f147e64]: An encryption detector is a computer tool designed to recognize encryption/encoding from a text message. The detector performs cryptanalysis, examines various features of the text, such as letter distribution, character repetition, word length, etc. to determine the type of encryption and guide users to the dedicated pages on dCode based on the type of code or encryption identified.
      - generic [ref=f147e65]:
        - heading "How to decrypt a cipher text?" [level=3] [ref=f147e66]
        - generic [ref=f147e68]:
          - paragraph [ref=f147e69]: To decrypt / decipher an encoded message, it is necessary to know the encryption used (or the encoding method, or the implemented cryptographic principle). Without knowing the technique chosen by the sender of the message, it is impossible to decrypt it (or decode it). Knowing the encryption (or encoding, or code) is therefore the first step to start the decryption (or decoding) process.
          - paragraph [ref=f147e70]: dCode therefore proposes, on this page above, an artificial intelligence tool dedicated to the automatic recognition/identification of encryption and direct links to dCode tools capable of deciphering the message/text.
      - generic [ref=f147e71]:
        - heading "How to recognize a cipher?" [level=3] [ref=f147e72]
        - generic [ref=f147e74]:
          - paragraph [ref=f147e75]: "To recognize/guess the type of cipher/coding used to encrypt/encode a message, dCode uses several detection/cryptanalysis methods:"
          - paragraph [ref=f147e76]:
            - text: —
            - link "Frequency analysis" [ref=f147e77] [cursor=pointer]:
              - /url: https://www.dcode.fr/frequency-analysis
            - text: ": This involves observing which characters in the message appear most frequently and in what proportions. This analysis can cover all characters, but generally focuses on the letters of the alphabet (A-Z) and numbers (0-9), which helps eliminate many cipher or coding methods. The analysis of"
            - link "bigrams" [ref=f147e78] [cursor=pointer]:
              - /url: https://www.dcode.fr/bigrams
            - text: or
            - link "trigrams" [ref=f147e79] [cursor=pointer]:
              - /url: https://www.dcode.fr/trigrams
            - text: (or more generally, groups of letters) allows for more refined cryptanalysis. The presence or absence of certain sequences provides valuable clues for determining the type of cipher.
          - paragraph [ref=f147e80]:
            - text: —
            - link "Coincidence index" [ref=f147e81] [cursor=pointer]:
              - /url: https://www.dcode.fr/index-coincidence
            - text: ": This assesses the degree of randomness in the distribution of characters in a message. In a language like English, certain characters appear much more frequently than others: the letter E is widely used, while the letter X remains much rarer. This natural tendency in intelligible texts helps distinguish a structured message from a sequence of encrypted characters."
          - paragraph [ref=f147e82]: "— Signature search: This involves identifying the distinctive features specific to certain ciphers or encodings. These characteristic elements make them easier to identify."
          - paragraph [ref=f147e84]:
            - text: "Example:"
            - link "Base64" [ref=f147e85] [cursor=pointer]:
              - /url: https://www.dcode.fr/base-64-encoding
            - text: code can contain all possible numbers and letters (
            - link "uppercase and lowercase" [ref=f147e86] [cursor=pointer]:
              - /url: https://www.dcode.fr/uppercase-lowercase
            - text: ) distributed fairly evenly, and three times out of four, it ends with the = sign.
          - paragraph [ref=f147e88]: "When the message is accompanied by instructions or clues, certain keywords can trigger more results thanks to the dCode database. Note: there is no need to specify known plaintext."
      - generic [ref=f147e89]:
        - heading "Why does the detector display a warning?" [level=3] [ref=f147e90]
        - generic [ref=f147e92]:
          - paragraph [ref=f147e93]:
            - text: Sometimes the
            - term [ref=f147e94]: cipher identifier
            - text: "finds little or no relevant result, several reasons are possible:"
          - paragraph [ref=f147e95]:
            - text: "— The message is too short: a message containing not enough characters does not allow a good"
            - link "frequency analysis" [ref=f147e96] [cursor=pointer]:
              - /url: https://www.dcode.fr/frequency-analysis
            - text: to be performed. The possibilities become very numerous without a way to precisely identify the encryption.
          - paragraph [ref=f147e97]:
            - text: "— The message has a low entropy: it is composed of few distinct characters (a binary message containing only 0s and 1s has a low entropy). Furthermore, nearly all messages can be stored"
            - link "in binary" [ref=f147e98] [cursor=pointer]:
              - /url: https://www.dcode.fr/binary-code
            - text: ", identifying the encryption precisely is difficult."
          - paragraph [ref=f147e99]: — The message contains unnecessary characters (such as spaces between each letter), which weakens the frequency analyses. Remove spaces or other unnecessary symbols for best results.
          - paragraph [ref=f147e100]: "— The message is over-encrypted: several successive encodings / ciphers have been applied, the over-encryption tends to mask the characteristic signatures of the original encryption."
          - paragraph [ref=f147e101]:
            - text: "— The message is composed of several distinct messages: the presence of several ciphers with different properties disturbs the detector which searches for a single cipher. Please"
            - link "split the message" [ref=f147e102] [cursor=pointer]:
              - /url: https://www.dcode.fr/text-splitter
            - text: to determine the coding of each portion.
          - paragraph [ref=f147e103]: "— The encryption used is recent: modern cryptography techniques are such that it is impossible to recognize an encrypted message from a random message, it is moreover a quality of a good encryption. Identification is, in essence, difficult."
          - paragraph [ref=f147e104]: "— The encryption used is very rare: dCode can detect more than 300 different ciphers and continues to improve thanks to your feedback and messages, but it is not impossible that some ciphers are still unknown/missing."
      - generic [ref=f147e105]:
        - heading "Why does the analyzer/recognizer not detect my cipher method?" [level=3] [ref=f147e106]
        - paragraph [ref=f147e109]: Sometimes, the recognition algorithm, based on artificial intelligence and machine learning, detects multiple signals or characteristics from different types of encryption, which can lead to approximate results. Do not hesitate to contact us by providing the encrypted message, the original message, and the encryption method used. This will allow dCode to teach the analyzer this new information for future analyses. The more data there is, the more accurate the detection will be.
      - generic [ref=f147e110]:
        - heading "How does the cipher identifier work?" [level=3] [ref=f147e111]
        - generic [ref=f147e113]:
          - paragraph [ref=f147e114]: The AI encryption detection program is based on a multilayer perceptron (MLP). An MLP is a type of neural network composed of multiple layers of interconnected neurons, where each layer transforms the received input before passing it on to the next. This structure allows the program to detect subtle patterns in data, improve its accuracy, and adapt to different types of encryption more effectively.
          - paragraph [ref=f147e115]: At the input layer there are the coded messages (with ngrams), and at the output layer the different types of known and referenced ciphers on dCode.
          - paragraph [ref=f147e116]: Regularly the database is updated and new ciphers are added which allows to refine the results.
      - button "❓ Ask a new question" [ref=f147e117] [cursor=pointer]
